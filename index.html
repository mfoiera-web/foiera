
<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foiera</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      font-family: Helvetica, Arial, sans-serif;
      color: #000;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 92px;
      padding: 24px;
      background: #fff;
      z-index: 10;
    }

    .title {
      margin: 0;
      font-size: 52px;
      font-weight: 300;
      line-height: 0.95;
      letter-spacing: -2px;
    }

    .gallery {
      padding: 92px 24px 40px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .item {
      position: relative;
    }

    .photo {
      aspect-ratio: 1 / 1;
      background: #e9e9e9;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .caption {
      margin-top: 7px;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.2;
      color: #777;
    }

    .caption .name {
      display: block;
      color: #222;
    }

    .caption .date {
      display: block;
      margin-top: 2px;
      color: #999;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .header {
        height: 78px;
        padding: 18px;
      }

      .title {
        font-size: 42px;
        letter-spacing: -1.5px;
      }

      .gallery {
        padding: 78px 18px 30px;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .caption {
        margin-top: 6px;
        font-size: 10px;
      }
    }
  </style>
</head>
